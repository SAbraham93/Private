<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Grok Video" />
  <title>Grok Video</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; background:#0b0b0f; color:#f7f7f8; min-height:100vh; }
    .wrap { max-width:680px; margin:0 auto; padding:calc(22px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
    h1 { font-size:32px; margin:8px 0 4px; letter-spacing:-.7px; }
    .sub { color:#9b9ba5; margin:0 0 22px; line-height:1.45; }
    .card { background:#15151b; border:1px solid #27272f; border-radius:20px; padding:16px; margin-bottom:14px; box-shadow:0 12px 35px rgba(0,0,0,.22); }
    label { display:block; font-size:13px; font-weight:700; color:#bdbdc6; margin:0 0 7px; }
    textarea,input,select { width:100%; border:1px solid #34343d; background:#0f0f14; color:#fff; border-radius:13px; padding:13px; font-size:16px; outline:none; }
    textarea { min-height:145px; resize:vertical; }
    textarea:focus,input:focus,select:focus { border-color:#777783; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field { margin-bottom:14px; }
    .field:last-child { margin-bottom:0; }
    .toggle { display:flex; gap:8px; margin-bottom:14px; }
    .tab { flex:1; border:1px solid #34343d; background:#101015; color:#aaaab5; padding:11px; border-radius:12px; font-weight:700; }
    .tab.active { background:#f4f4f5; color:#111; border-color:#f4f4f5; }
    .upload { display:none; }
    .upload.show { display:block; }
    .help { color:#8f8f99; font-size:12px; margin-top:7px; line-height:1.4; }
    button.primary { width:100%; border:0; border-radius:15px; padding:15px; font-size:17px; font-weight:800; background:#f7f7f8; color:#111; }
    button.primary:disabled { opacity:.45; }
    button.secondary { width:100%; margin-top:10px; border:1px solid #34343d; border-radius:15px; padding:13px; font-size:15px; font-weight:700; background:#111116; color:#d7d7df; }
    .status { display:none; }
    .status.show { display:block; }
    .pill { display:inline-flex; align-items:center; gap:8px; background:#22222a; border-radius:999px; padding:8px 11px; font-size:13px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#eee; animation:pulse 1.3s infinite; }
    @keyframes pulse { 50% { opacity:.25; } }
    .message { margin-top:12px; color:#c8c8d0; white-space:pre-wrap; line-height:1.45; }
    video { width:100%; border-radius:16px; margin-top:14px; background:#000; max-height:70vh; }
    a.download { display:inline-block; margin-top:10px; color:#fff; }
    .error { color:#ff9b9b; }
    .tiny { font-size:11px; color:#73737d; margin-top:14px; text-align:center; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Grok Video</h1>
  <p class="sub">Generate Grok Imagine videos through your OpenRouter account.</p>

  <div class="card">
    <div class="toggle">
      <button id="textTab" class="tab active" type="button">Text → Video</button>
      <button id="imageTab" class="tab" type="button">Image → Video</button>
    </div>

    <div id="uploadSection" class="upload">
      <div class="field">
        <label for="image">Starting image</label>
        <input id="image" type="file" accept="image/*" />
        <div class="help">Requires Vercel Blob to be connected to this project. Keep the image under 4 MB.</div>
      </div>
    </div>

    <div class="field">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="A cinematic night drive through Tokyo in the rain, reflections on the windshield, slow camera movement..."></textarea>
    </div>

    <div class="grid">
      <div class="field">
        <label for="duration">Duration</label>
        <select id="duration">
          <option value="5">5 seconds</option>
          <option value="8">8 seconds</option>
          <option value="10">10 seconds</option>
          <option value="15">15 seconds</option>
        </select>
      </div>
      <div class="field">
        <label for="resolution">Resolution</label>
        <select id="resolution">
          <option value="720p" selected>720p</option>
          <option value="480p">480p</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="aspect">Aspect ratio</label>
      <select id="aspect">
        <option value="9:16" selected>9:16 — iPhone / Reels</option>
        <option value="16:9">16:9 — Landscape</option>
        <option value="1:1">1:1 — Square</option>
        <option value="4:3">4:3</option>
        <option value="3:4">3:4</option>
        <option value="3:2">3:2</option>
        <option value="2:3">2:3</option>
      </select>
    </div>

    <button id="generate" class="primary" type="button">Generate video</button>
<button id="testConnection" class="secondary" type="button">Test OpenRouter connection</button>
  </div>

  <div id="statusCard" class="card status">
    <div class="pill"><span class="dot"></span><span id="statusText">Submitting…</span></div>
    <div id="message" class="message"></div>
    <video id="video" controls playsinline style="display:none"></video>
    <a id="download" class="download" style="display:none" download="grok-video.mp4">Open / save video</a>
  </div>

  <div class="tiny">Your OpenRouter API key stays in Vercel's server-side environment variables and is never placed in this page.</div>
</div>

<script>
let mode = "text";
let pollTimer = null;
const $ = (id) => document.getElementById(id);

function setMode(next) {
  mode = next;
  $("textTab").classList.toggle("active", next === "text");
  $("imageTab").classList.toggle("active", next === "image");
  $("uploadSection").classList.toggle("show", next === "image");
}
$("textTab").onclick = () => setMode("text");
$("imageTab").onclick = () => setMode("image");

async function parseApiResponse(r) {
  const text = await r.text();
  let data = null;
  try { data = JSON.parse(text); } catch {}
  if (!r.ok) {
    const msg = data?.error || text || `HTTP ${r.status}`;
    const source = data?.source ? ` (${data.source})` : "";
    throw new Error(`${msg}${source}`);
  }
  return data ?? {};
}

async function uploadImage() {
  const file = $("image").files[0];
  if (!file) throw new Error("Choose a starting image first.");
  if (file.size > 4 * 1024 * 1024) throw new Error("Please use an image smaller than 4 MB.");
  const fd = new FormData();
  fd.append("file", file);
  const r = await fetch("./api/upload", { method:"POST", body:fd });
  const data = await parseApiResponse(r);
  if (!data.url) throw new Error("Upload completed but no image URL was returned.");
  return data.url;
}

async function testConnection() {
  $("statusCard").classList.add("show");
  $("statusText").textContent = "Testing…";
  $("message").textContent = "Checking your Vercel server, OpenRouter key, and video-model access.";
  $("message").className = "message";
  $("video").style.display = "none";
  $("download").style.display = "none";
  $("testConnection").disabled = true;

  try {
    const r = await fetch("./api/test", { method:"GET", cache:"no-store" });
    const data = await parseApiResponse(r);
    $("statusText").textContent = "Connection OK";
    $("message").textContent = data.grok_available
      ? "Your API key works and Grok Imagine Video is visible through OpenRouter. You can generate now."
      : "Your API key works and OpenRouter is reachable, but Grok Imagine Video was not present in the returned video-model list.";
  } catch (e) {
    fail(e.message);
  } finally {
    $("testConnection").disabled = false;
  }
}

async function startGeneration() {
  const prompt = $("prompt").value.trim();
  if (!prompt) return alert("Enter a prompt.");

  if (pollTimer) clearTimeout(pollTimer);
  $("generate").disabled = true;
  $("statusCard").classList.add("show");
  $("statusText").textContent = mode === "image" ? "Uploading image…" : "Submitting…";
  $("message").textContent = "";
  $("message").className = "message";
  $("video").removeAttribute("src");
  $("video").load();
  $("video").style.display = "none";
  $("download").style.display = "none";

  try {
    let imageUrl = null;
    if (mode === "image") imageUrl = await uploadImage();

    $("statusText").textContent = "Submitting to Grok…";
    const r = await fetch("./api/generate", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        prompt,
        duration:Number($("duration").value),
        resolution:$("resolution").value,
        aspect_ratio:$("aspect").value,
        imageUrl
      })
    });

    const data = await parseApiResponse(r);
    if (!data.id) throw new Error("No video job ID was returned.");
    $("message").textContent = `Job: ${data.id}`;
    await poll(data.id);
  } catch (e) {
    fail(e.message);
  }
}

async function poll(id) {
  try {
    $("statusText").textContent = "Generating…";
    const r = await fetch(`./api/status?id=${encodeURIComponent(id)}`, { cache:"no-store" });
    const data = await parseApiResponse(r);
    const status = String(data.status || "pending").toLowerCase();
    $("statusText").textContent = status === "completed" ? "Completed" : `Generating — ${status}`;

    if (status === "completed") {
      const url = `./api/video?id=${encodeURIComponent(id)}`;
      $("video").src = url;
      $("video").style.display = "block";
      $("download").href = url;
      $("download").style.display = "inline-block";
      $("message").textContent = data.usage?.cost != null
        ? `Finished. OpenRouter cost: $${Number(data.usage.cost).toFixed(4)}`
        : "Finished.";
      $("generate").disabled = false;
      return;
    }

    if (["failed","cancelled","expired"].includes(status)) {
      const detail = data.error?.message || data.error || `Video generation ${status}.`;
      throw new Error(detail);
    }

    pollTimer = setTimeout(() => poll(id), 10000);
  } catch (e) {
    fail(e.message);
  }
}

function fail(msg) {
  $("statusText").textContent = "Error";
  $("message").textContent = msg || "Unknown error";
  $("message").className = "message error";
  $("generate").disabled = false;
}

$("generate").onclick = startGeneration;
$("testConnection").onclick = testConnection;
</script>
</body>
</html>
